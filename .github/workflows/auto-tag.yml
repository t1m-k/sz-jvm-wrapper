name: Auto Tag

on:
  pull_request:
    types: [closed]
    branches: [master]

jobs:
  tag:
    if: github.event.pull_request.merged == true && (contains(github.event.pull_request.labels.*.name, 'release:patch') || contains(github.event.pull_request.labels.*.name, 'release:minor') || contains(github.event.pull_request.labels.*.name, 'release:major'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: latest
        run: |
          TAG=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          echo "tag=${TAG:-v0.0.0}" >> "$GITHUB_OUTPUT"

      - name: Bump version
        id: bump
        run: |
          VERSION="${{ steps.latest.outputs.tag }}"
          VERSION="${VERSION#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          if ${{ contains(github.event.pull_request.labels.*.name, 'release:major') }}; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif ${{ contains(github.event.pull_request.labels.*.name, 'release:minor') }}; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          echo "version=v$MAJOR.$MINOR.$PATCH" >> "$GITHUB_OUTPUT"

      - name: Extract release description
        id: description
        run: |
          # Get the last commit SHA from the PR
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          
          # Get commit message
          MSG=$(git show "$HEAD_SHA" --format=%B --no-patch)
          
          # Extract description from line starting with "release: "
          DESCRIPTION=$(echo "$MSG" | grep '^release: ' | sed 's/^release: //' | head -n1)
          
          # Fallback to default if not found
          if [ -z "$DESCRIPTION" ]; then
            DESCRIPTION="new release placeholder - this text needs to be updated"
          fi
          
          echo "description=$DESCRIPTION" >> "$GITHUB_OUTPUT"

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.bump.outputs.version }}" -m "${{ steps.description.outputs.description }}"
          git push origin "${{ steps.bump.outputs.version }}"
